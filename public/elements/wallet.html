<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device wallet</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<style>
  :root { --bg: #f4f4f2; --panel: #fff; --text: #141413; --muted: #6f6e69; --line: #e3e2de; --accent: #111; --ok: #12805c; --err: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1d1b; --panel: #2a2a27; --text: #f3f2ee; --muted: #a9a8a2; --line: #3b3a36; --accent: #f3f2ee; --ok: #34d399; --err: #f97066; } }
  :root.light-only { --bg: #f4f4f2; --panel: #fff; --text: #141413; --muted: #6f6e69; --line: #e3e2de; --accent: #111; --ok: #12805c; --err: #b42318; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 15px/1.4 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: var(--text); }
  .sheet { height: 100%; background: var(--bg); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding: 8px 16px 16px; animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header strong { display: flex; align-items: center; gap: 6px; font-size: 16px; }
  button { font: inherit; }
  .link { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; }
  .total { background: var(--panel); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .total .amt { font-size: 22px; font-weight: 600; }
  .list { background: var(--panel); border-radius: 12px; overflow: auto; flex: 1; min-height: 0; }
  .card { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .card:last-child { border-bottom: 0; }
  .chip { width: 40px; height: 26px; border-radius: 5px; color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; text-transform: uppercase; letter-spacing: .03em; }
  .card small { color: var(--muted); display: block; font-size: 12px; }
  .contact { background: var(--panel); border-radius: 12px; padding: 4px 14px; margin-top: 10px; }
  .contact label { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .contact label:last-child { border-bottom: 0; }
  .contact input { border: 0; background: transparent; color: var(--text); font: inherit; text-align: right; min-width: 0; flex: 1; outline: 0; }
  .confirm { margin-top: 12px; height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .confirm:disabled { opacity: .6; cursor: default; }
  .status { text-align: center; padding: 6px 0 0; min-height: 26px; font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--ok); font-weight: 600; } .status.err { color: var(--err); }
  .note { text-align: center; color: var(--muted); font-size: 11px; margin-top: 6px; }
  input[type=radio] { accent-color: var(--accent); }
</style>
</head>
<body>
<div class="sheet">
  <div class="grip" aria-hidden="true"></div>
  <header>
    <strong><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg><span id="title">Wallet</span></strong>
    <button class="link" id="cancel" type="button">Cancel</button>
  </header>
  <div class="total"><span id="label"></span><span class="amt" id="amount"></span></div>
  <div class="list" id="cards" role="radiogroup" aria-label="Cards in your wallet"></div>
  <div class="contact" id="contact" hidden></div>
  <button class="confirm" id="confirm" type="button"></button>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="note" id="note"></div>
</div>
<script src="/elements/wallet.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Express checkout</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<style>
  :root { --primary: #0f766e; --bg: #ffffff; --text: #1c1917; --muted: #78716c; --border: #d6d3d1; --danger: #b42318; --soft: #f5f5f4; --radius: 8px; --font: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  :root.night { --bg: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --border: #44403c; --danger: #f97066; --soft: #292524; --primary: #2dd4bf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); font: 14px/1.4 var(--font); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: var(--radius); font: 600 15px/1 var(--font); cursor: pointer; }
  .wallet { background: #111; color: #fff; }
  :root.night .wallet { background: #f5f5f4; color: #111; }
  .quick { background: var(--primary); color: #fff; }
  :root.night .quick { color: #0c0a09; }
  .btn:focus-visible, input:focus, .card:focus-within { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .panel { margin-top: 10px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); display: grid; gap: 10px; }
  .panel h2 { margin: 0; font-size: 14px; }
  .line { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font: inherit; font-size: 15px; }
  .sec { height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--soft); color: var(--text); font: 600 14px var(--font); cursor: pointer; }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
  .card input { flex: none; width: auto; height: auto; }
  .note { margin: 0; color: var(--muted); font-size: 12px; }
  .err { color: var(--danger); font-size: 13px; }
  .ok { color: var(--primary); font-weight: 600; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; justify-self: start; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/elements/express.js"></script>
</body>
</html>

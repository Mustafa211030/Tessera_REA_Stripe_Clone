<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card element</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<style>
  :root { --text: #1c1917; --muted: #78716c; --border: #d6d3d1; --focus: #0f766e; --error: #b42318; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --text: #f5f5f4; --muted: #a8a29e; --border: #44403c; --bg: #1c1917; --focus: #2dd4bf; --error: #f97066; } }
  :root.light-only { --text: #1c1917; --muted: #78716c; --border: #d6d3d1; --focus: #0f766e; --error: #b42318; --bg: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font: 15px/1.4 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: var(--text); }
  .row { display: grid; grid-template-columns: 1fr 88px 72px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .row:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
  .row.invalid { border-color: var(--error); }
  input { border: 0; outline: 0; padding: 11px 12px; font: inherit; color: inherit; background: transparent; min-width: 0; }
  input + input { border-left: 1px solid var(--border); }
  input::placeholder { color: var(--muted); }
  .brand { position: absolute; right: 170px; top: 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .wrap { position: relative; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" id="row">
    <input id="number" inputmode="numeric" autocomplete="cc-number" placeholder="Card number" aria-label="Card number" maxlength="23">
    <input id="exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM / YY" aria-label="Expiration date" maxlength="7">
    <input id="cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC" aria-label="Security code" maxlength="4">
  </div>
  <span class="brand" id="brand" aria-hidden="true"></span>
</div>
<script src="/elements/card.js"></script>
</body>
</html>

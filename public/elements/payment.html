<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment element</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<style>
  :root {
    --primary: #0f766e; --bg: #ffffff; --text: #1c1917; --muted: #78716c; --border: #d6d3d1; --danger: #b42318; --soft: #f5f5f4;
    --radius: 8px; --font: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; --space: 4px;
  }
  :root.night { --bg: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --border: #44403c; --danger: #f97066; --soft: #292524; --primary: #2dd4bf; }
  :root.flat { --border: transparent; --soft: #efedea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); font: 14px/1.4 var(--font); }
  .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: calc(var(--space) * 2); margin-bottom: calc(var(--space) * 3); }
  .tab { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
  :root.flat .tab, :root.flat input, :root.flat select { background: var(--soft); }
  .tab[aria-selected="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); color: var(--text); font-weight: 600; }
  .tab:focus-visible, input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent); }
  .acc { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .acc-item + .acc-item { border-top: 1px solid var(--border); }
  .acc-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: 0; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  .acc-body { padding: 0 14px 14px; background: var(--bg); }
  .grid { display: grid; gap: calc(var(--space) * 3); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--space) * 3); }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font: inherit; font-size: 15px; transition: border-color .15s, box-shadow .15s; }
  input.invalid { border-color: var(--danger); }
  .err { color: var(--danger); font-size: 13px; min-height: 0; }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
  .plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; border-radius: var(--radius); background: var(--soft); font-size: 13px; }
  .plan b { display: block; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); display: inline-block; margin-bottom: 4px; }
  svg { flex: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/elements/payment.js"></script>
</body>
</html>
